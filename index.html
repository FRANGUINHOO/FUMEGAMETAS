<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FumegaMetas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <header>
            <h1>FUMEGAMETAS</h1>
            <p class="subtitle">Acompanhamento em Tempo Real</p>
        </header>

        <section class="card form-card">
            <h2>Criar Nova Meta</h2>
            <form id="goalForm">
                <div class="form-row">
                    <div class="input-group flex-2">
                        <label for="title">Título da Meta</label>
                        <input type="text" id="title" placeholder="Ex: Estudar para a prova" required>
                    </div>

                    <div class="input-group flex-1">
                        <label for="category">Categoria</label>
                        <select id="category">
                            <option value="Trabalho">Trabalho</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Pessoal">Pessoal</option>
                        </select>
                    </div>
                </div>

                <!-- Atalho de Tempo Rápido -->
                <div class="input-group">
                    <label>Tempo Rápido (ou escolha a hora exata abaixo):</label>
                    <div class="quick-buttons">
                        <button type="button" class="btn-quick" onclick="setQuickMinutes(15)">+15 min</button>
                        <button type="button" class="btn-quick" onclick="setQuickMinutes(30)">+30 min</button>
                        <button type="button" class="btn-quick" onclick="setQuickMinutes(60)">+1 Hora</button>
                        <button type="button" class="btn-quick" onclick="setQuickMinutes(120)">+2 Horas</button>
                    </div>
                </div>

                <!-- Campos Separados de Data e Hora -->
                <div class="form-row">
                    <div class="input-group flex-1">
                        <label for="targetDate">Data do Prazo</label>
                        <input type="date" id="targetDate" required>
                    </div>

                    <div class="input-group flex-1">
                        <label for="targetHour">Hora do Prazo</label>
                        <input type="time" id="targetHour" step="1" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Adicionar Meta</button>
            </form>
        </section>

        <section class="card list-card">
            <div class="list-header">
                <h2>Minhas Metas</h2>
                <div class="stats-bar">
                    <span id="statActive">Ativas: 0</span>
                    <span id="statExpired">Esgotadas: 0</span>
                </div>
            </div>
            
            <div id="goalsList" class="goals-container">
                <p class="empty-msg">Nenhuma meta cadastrada no momento.</p>
            </div>
        </section>
    </div>

    <!-- Modal para Exibição em Tela Cheia -->
    <div id="fullscreenModal" class="fullscreen-modal">
        <div class="fullscreen-content">
            <button class="close-modal-btn" onclick="closeFullscreen()">FECHAR [X]</button>
            <h2 id="fullscreenTitle">TÍTULO DA META</h2>
            <span id="fullscreenCategory" class="badge">CATEGORIA</span>
            <div id="fullscreenTimer" class="fullscreen-timer">00:00:00</div>
            <p id="fullscreenStatus" class="fullscreen-status">EM ANDAMENTO</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
